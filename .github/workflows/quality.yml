name: Quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-quality:
    name: Deterministic quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check -r app/requirements.txt
          python -m pip check

      - name: Install isolated QA tools
        run: |
          python -m venv "$RUNNER_TEMP/localgpt-qa-tools"
          "$RUNNER_TEMP/localgpt-qa-tools/bin/python" -m pip install --disable-pip-version-check \
            'ruff==0.17.0' 'bandit==1.9.4' 'pip-audit==2.10.1' 'detect-secrets==1.5.0'

      - name: Lint and scan changed Python files
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          "$RUNNER_TEMP/localgpt-qa-tools/bin/python" - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          candidates = [os.environ.get("PR_BASE_SHA", ""), os.environ.get("PUSH_BASE_SHA", "")]
          default_branch = os.environ.get("DEFAULT_BRANCH", "")
          if default_branch:
              candidates.append(f"origin/{default_branch}")
          base = None
          for candidate in candidates:
              if not candidate or set(candidate) == {"0"}:
                  continue
              check = subprocess.run(["git", "rev-parse", "--verify", candidate], capture_output=True)
              if check.returncode == 0:
                  base = candidate
                  break
          if base is None:
              raise SystemExit("Could not resolve a base revision for incremental Python lint.")

          changed = subprocess.run(
              ["git", "diff", "--name-only", "--diff-filter=ACMRT", f"{base}...HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          python_files = [path for path in changed if path.endswith(".py") and Path(path).is_file()]
          if python_files:
              tools = Path(os.environ["RUNNER_TEMP"]) / "localgpt-qa-tools/bin"
              subprocess.run([str(tools / "ruff"), "check", "--select", "E4,E7,E9,F", *python_files], check=True)
              subprocess.run([str(tools / "bandit"), "-q", "-ll", "-iii", *python_files], check=True)
          else:
              print("No changed Python files to lint.")
          PY

      - name: Audit pinned Python requirements
        run: >-
          "$RUNNER_TEMP/localgpt-qa-tools/bin/pip-audit" -r app/requirements.txt

      - name: Scan tracked working tree for new secrets
        run: |
          "$RUNNER_TEMP/localgpt-qa-tools/bin/python" - <<'PY'
          import json
          import os
          import subprocess
          import sys

          files = subprocess.run(
              ["git", "ls-files", "-z", "--cached", "--others", "--exclude-standard"],
              check=True,
              capture_output=True,
          ).stdout.decode().split("\0")
          files = [path for path in files if path]
          scanner = os.path.join(os.environ["RUNNER_TEMP"], "localgpt-qa-tools/bin/detect-secrets-hook")
          result = subprocess.run(
              [scanner, "--no-verify", "--json", "--baseline", ".secrets.baseline", *files],
              capture_output=True,
              text=True,
          )
          if result.returncode == 0:
              print(f"No new secret candidates in {len(files)} files.")
              raise SystemExit(0)
          try:
              findings = json.loads(result.stdout).get("results", {})
          except (json.JSONDecodeError, AttributeError):
              findings = {}
          for path, items in findings.items():
              for item in items:
                  print(f"Secret candidate: {path}:{item.get('line_number')} ({item.get('type')})")
          if not findings:
              print(f"Secret scanner failed or baseline drifted (exit {result.returncode}).")
          raise SystemExit(1)
      - name: Run deterministic Python suite
        env:
          RAG_EMBEDDING_PROVIDER: local_hash
          RAG_EMBEDDING_MODEL: local-hash-v1
          RAG_EMBEDDING_VERSION: local-hash-v1
          RAG_EMBEDDING_DIMENSIONS: "256"
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run static and UI checks
        run: |
          python -m compileall -q app backend tests
          node --check web_ui/js/app.js
          node tests/markdown_rendering.test.mjs
          node --test tests/*.test.mjs
          for script in setup/setup_localgpt.sh start_localgpt.sh start_localgpt_lan.sh stop_localgpt_lan.sh tools/LTrnsrb.sh tools/setup_whisper_cpp_macos.sh; do
            bash -n "$script"
          done
