<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LocalGPT Whisper Transcriber</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header__row">
      <h1 id="appTitle">LocalGPT Whisper Transcriber</h1>
      <div class="lang-switch" role="group" aria-label="Language">
        <button class="lang-flag is-active" id="langEn" type="button" data-lang="en" title="English" aria-label="English">
          <img src="img/flag-us.svg" alt="English" />
        </button>
        <button class="lang-flag" id="langUk" type="button" data-lang="uk" title="Українська" aria-label="Українська">
          <img src="img/flag-ua.svg" alt="Українська" />
        </button>
        <button class="lang-flag" id="langRu" type="button" data-lang="ru" title="Русский" aria-label="Русский">
          <img src="img/flag-ru.svg" alt="Русский" />
        </button>
      </div>
    </div>
    <p class="status" id="healthStatus">Проверка сервера...</p>
  </header>

  <main class="app-layout">
    <section class="panel control-panel">
      <h2 id="controlTitle">Управление</h2>

      <label class="field-label" id="modelLabel" for="modelSelect">Модель Whisper</label>
      <select id="modelSelect" class="input-control"></select>

      <input type="file" id="fileInput" accept="audio/*,video/*" hidden />
      <button id="btnChooseFile" class="btn">Выбрать файл</button>
      <p class="file-hint file-hint--empty" id="fileHint">Локальный файл: не выбран</p>

      <div class="record-row">
        <button id="btnRecord" class="btn btn-record" title="Запись голоса">⏺</button>
        <button id="btnSaveRecording" class="btn btn-secondary" disabled>Сохранить запись</button>
      </div>

      <p class="muted" id="recordingInfo">Запись не начата.</p>
      <p class="muted voice-activity voice-activity--idle" id="voiceActivity">Голос: —</p>
      <p class="status" id="transcribeStatus"></p>

      <section class="download-widget" id="downloadWidget" hidden>
        <div class="download-widget__top">
          <strong id="downloadModelName">Модель: —</strong>
          <span id="downloadPercent">0%</span>
        </div>
        <progress id="downloadProgress" max="100" value="0"></progress>
        <div class="download-widget__meta">
          <span id="downloadSpeed">Скорость: 0 MB/s</span>
          <span id="downloadMessage">Подготовка...</span>
        </div>
      </section>
    </section>

    <section class="panel editor-panel">
      <div class="panel-head">
        <h2 id="transcriptTitle">Транскрибация</h2>
        <div class="actions">
          <button id="btnCopy" class="btn btn-secondary">copy</button>
          <button id="btnSave" class="btn btn-secondary">save</button>
          <button id="btnClear" class="btn btn-secondary">clear</button>
        </div>
      </div>
      <textarea id="transcriptOutput" placeholder="Здесь появится результат транскрибации..."></textarea>
    </section>

    <section class="panel history-panel">
      <h2 id="historyTitle">История</h2>
      <div id="historyList" class="history-list"></div>
    </section>
  </main>

  <div id="historyModal" class="modal-overlay" hidden>
    <div class="modal-window" role="dialog" aria-modal="true" aria-labelledby="historyModalTitle">
      <div class="panel-head">
        <h3 id="historyModalTitle">Транскрипция</h3>
        <button id="btnCloseModal" class="btn btn-secondary">Закрыть</button>
      </div>
      <p class="muted" id="historyModalMeta"></p>
      <textarea id="historyModalText" class="modal-textarea"></textarea>
      <div class="actions actions-left">
        <button id="btnSendFromModal" class="btn">send</button>
        <button id="btnDeleteFromModal" class="btn btn-danger" type="button">Удалить</button>
      </div>
    </div>
  </div>

  <button
    id="iosQuickLink"
    class="ios-quick-link"
    type="button"
    aria-label="iOS URL"
    title="iOS URL"
    hidden
  >
    <span class="ios-quick-link__mark">!</span>
    <span id="iosQuickLinkText" class="ios-quick-link__tooltip"></span>
  </button>

  <div id="appToast" class="app-toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
